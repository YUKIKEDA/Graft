name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    name: Format, build, unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check CSharpier
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore Graft.slnx

      - name: Build
        run: dotnet build Graft.slnx --no-restore -c Debug

      - name: Test Protocol
        run: dotnet test tests/Graft.Protocol.Tests/Graft.Protocol.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=protocol.trx"

      - name: Test TestUtilities
        run: dotnet test tests/Graft.TestUtilities.Tests/Graft.TestUtilities.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=testutilities.trx"

      - name: Test Instrumentation
        run: dotnet test tests/Graft.Instrumentation.Tests/Graft.Instrumentation.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=instrumentation.trx"

      - name: Test Instrumentation surface (non-GraftTest)
        run: dotnet test tests/Graft.Instrumentation.Surface.Tests/Graft.Instrumentation.Surface.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=instrumentation-surface.trx"

      - name: Test Analyzer
        run: dotnet test tests/Graft.Instrumentation.Analyzer.Tests/Graft.Instrumentation.Analyzer.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=analyzer.trx"

      - name: Test Instrumentation.Wpf (in-process)
        run: dotnet test tests/Graft.Instrumentation.Wpf.Tests/Graft.Instrumentation.Wpf.Tests.csproj --no-build --no-restore -c Debug --logger "trx;LogFileName=wpf.trx"

      - name: Test Core (exclude launched-app UI)
        run: dotnet test tests/Graft.Core.Tests/Graft.Core.Tests.csproj --no-build --no-restore -c Debug --filter "Category!=UI" --logger "trx;LogFileName=core.trx"

      - name: Test McpServer (stdio, no launched app)
        run: dotnet test tests/Graft.McpServer.Tests/Graft.McpServer.Tests.csproj --no-build --no-restore -c Debug --filter "Category!=UI" --logger "trx;LogFileName=mcp.trx"

      - name: Pack GraftTest packages
        shell: pwsh
        run: |
          $projects = @(
            "src/Graft.Protocol/Graft.Protocol.csproj",
            "src/Graft.Core/Graft.Core.csproj",
            "src/Graft.Instrumentation/Graft.Instrumentation.csproj",
            "src/Graft.Instrumentation.Analyzer/Graft.Instrumentation.Analyzer.csproj",
            "src/Graft.Instrumentation.Wpf/Graft.Instrumentation.Wpf.csproj",
            "src/Graft.TestUtilities/Graft.TestUtilities.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project -c GraftTest --no-restore -o artifacts --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $instrumentation = Get-ChildItem artifacts -Filter *.nupkg | Where-Object { $_.Name -match '^Graft\.Instrumentation\.\d' } | Select-Object -First 1
          if ($null -eq $instrumentation) { throw "Graft.Instrumentation nupkg was not produced" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($instrumentation.FullName)
          try {
            $dll = $zip.Entries | Where-Object { $_.Name -eq "Graft.Instrumentation.dll" -and $_.FullName -like "lib/*" } | Select-Object -First 1
            if ($null -eq $dll) { throw "Graft.Instrumentation package is missing lib/**/Graft.Instrumentation.dll" }
            $analyzer = $zip.Entries | Where-Object { $_.FullName -eq "analyzers/dotnet/cs/Graft.Instrumentation.Analyzer.dll" } | Select-Object -First 1
            if ($null -eq $analyzer) { throw "Graft.Instrumentation package is missing analyzers/dotnet/cs/Graft.Instrumentation.Analyzer.dll" }
            $temp = Join-Path $env:RUNNER_TEMP "graft-pack-check.dll"
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($dll, $temp, $true)
          }
          finally {
            $zip.Dispose()
          }
          cmd /c "findstr /M /C:AgentPipeServer `"$temp`""
          if ($LASTEXITCODE -ne 0) { throw "Packed Graft.Instrumentation.dll was built without the agent" }
          $wpf = Get-ChildItem artifacts -Filter *.nupkg | Where-Object { $_.Name -match '^Graft\.Instrumentation\.Wpf\.\d' } | Select-Object -First 1
          if ($null -eq $wpf) { throw "Graft.Instrumentation.Wpf nupkg was not produced" }
          $wpfZip = [System.IO.Compression.ZipFile]::OpenRead($wpf.FullName)
          try {
            $wpfAnalyzer = $wpfZip.Entries | Where-Object { $_.FullName -eq "analyzers/dotnet/cs/Graft.Instrumentation.Analyzer.dll" } | Select-Object -First 1
            if ($null -eq $wpfAnalyzer) { throw "Graft.Instrumentation.Wpf package is missing analyzers/dotnet/cs/Graft.Instrumentation.Analyzer.dll" }
          }
          finally {
            $wpfZip.Dispose()
          }
